<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMAIL SHOP</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 40px 20px;
    }

    .logo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ffd600;
      color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      font-size: 28px;
      font-weight: bold;
      box-shadow: 0 0 30px #ffd600;
    }

    h1 {
      color: #ffd600;
      font-size: 48px;
      margin-top: 25px;
    }

    p {
      color: #ccc;
      font-size: 18px;
    }

    .btn {
      display: block;
      margin: 18px 0;
      padding: 18px;
      border-radius: 18px;
      text-decoration: none;
      background: #111;
      border: 2px solid #ffd600;
      color: #ffd600;
      font-size: 22px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ffd600;
      color: black;
      transform: scale(1.03);
    }

    .telegram {
      margin-top: 30px;
      display: inline-block;
      background: #ffd600;
      color: black;
      padding: 16px 30px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }

    footer {
      margin-top: 60px;
      color: #777;
    }
  </style>
</head>

  <div class="container">

    </a>

      <a class="btn" href="https://t.me/EmailStore16" target="_blank">Panel Pterodactyl</a>
